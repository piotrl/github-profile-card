name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Ensure dist and demo are in the site
        run: |
          [ -f _site/dist/gh-profile-card.min.js ] || { sudo mkdir -p _site/dist && sudo cp dist/gh-profile-card.min.js _site/dist/; }
          test -f _site/dist/gh-profile-card.min.js
          test -f _site/demo/index.html
          test -f _site/index.html

      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
